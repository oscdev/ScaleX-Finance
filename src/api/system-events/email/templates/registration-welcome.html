<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome — ScaleX Finance</title>
</head>
<body style="margin:0; padding:0; background-color:#fff7ed; font-family:Arial, Helvetica, sans-serif; color:#1c1917; line-height:1.55;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#fff7ed" style="width:100%; background-color:#fff7ed;">
        <tr>
            <td align="center" style="padding:24px 12px;">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:600px; max-width:600px; background-color:#ffffff; border:1px solid #fed7aa;">
                    <tr>
                        <td bgcolor="#ea580c" style="background-color:#ea580c; height:6px; font-size:0; line-height:0;">&nbsp;</td>
                    </tr>
                    <tr>
                        <td style="padding:32px 28px;">
                            <p style="margin:0 0 6px 0; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:#c2410c; font-weight:bold;">Account access</p>
                            <h1 style="margin:0 0 16px 0; font-size:24px; color:#9a3412;">Welcome to ScaleX Finance</h1>
                            <p style="margin:0 0 14px 0; font-size:15px;">Hello <strong>{{recipientName}}</strong> ({{recipientRole}}),</p>
                            <p style="margin:0 0 22px 0; font-size:15px;">{{welcomeMessage}}</p>
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td bgcolor="#ea580c" style="background-color:#ea580c; border-radius:4px;">
                                        <a href="{{actionUrl}}" style="display:inline-block; padding:12px 22px; color:#ffffff; text-decoration:none; font-size:15px; font-weight:bold;">{{actionLabel}}</a>
                                    </td>
                                </tr>
                            </table>
                            <p style="margin:18px 0 0 0; font-size:12px; color:#78716c; word-break:break-all;">Or open this link:<br>{{actionUrl}}</p>
                            <p style="margin:24px 0 0 0; font-size:13px; color:#78716c;">ScaleX Finance — Users &amp; Access</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
