<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — ScaleX Finance</title>
</head>
<body style="margin:0; padding:0; background-color:#f8fafc; font-family:Arial, Helvetica, sans-serif; color:#0f172a; line-height:1.55;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f8fafc" style="width:100%; background-color:#f8fafc;">
        <tr>
            <td align="center" style="padding:24px 12px;">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:600px; max-width:600px; background-color:#ffffff; border:1px solid #cbd5e1;">
                    <tr>
                        <td style="padding:32px 28px;">
                            <p style="margin:0 0 8px 0; font-size:20px; font-weight:bold; color:#0f172a;">Reset your password</p>
                            <p style="margin:0 0 16px 0; font-size:15px;">Hello {{userFirstname}},</p>
                            <p style="margin:0 0 16px 0; font-size:15px;">We received a request to reset the password for your ScaleX Finance admin account. Use the button below to choose a new password. If you did not request this, you can ignore this email.</p>
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td bgcolor="#0f172a" style="background-color:#0f172a;">
                                        <a href="{{url}}" style="display:inline-block; padding:12px 24px; color:#ffffff; text-decoration:none; font-size:15px; font-weight:bold;">Reset password</a>
                                    </td>
                                </tr>
                            </table>
                            <p style="margin:18px 0 0 0; font-size:12px; color:#64748b; word-break:break-all;">Reset link:<br>{{url}}</p>
                            <p style="margin:24px 0 0 0; font-size:13px; color:#64748b;">ScaleX Finance — Security</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
