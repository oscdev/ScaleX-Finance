<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Status Updated — ScaleX Finance</title>
</head>
<body style="margin:0; padding:0; background-color:#eef2ff; font-family:Arial, Helvetica, sans-serif; color:#1e293b; line-height:1.55;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#eef2ff" style="width:100%; background-color:#eef2ff;">
        <tr>
            <td align="center" style="padding:24px 12px;">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:600px; max-width:600px; background-color:#ffffff; border:1px solid #c7d2fe;">
                    <tr>
                        <td bgcolor="#4f46e5" style="background-color:#4f46e5; padding:16px 28px;">
                            <p style="margin:0; color:#ffffff; font-size:18px; font-weight:bold;">Lead Status Update</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:28px;">
                            <p style="margin:0 0 12px 0; font-size:15px;">Hello <strong>{{recipientName}}</strong> ({{recipientRole}}),</p>
                            <p style="margin:0 0 20px 0; font-size:15px;">The status of a lead assigned to you has changed. Details below:</p>
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; border-collapse:collapse;">
                                <tr>
                                    <td width="38%" valign="top" bgcolor="#f8fafc" style="padding:11px; border:1px solid #e2e8f0; font-weight:bold; font-size:14px; background-color:#f8fafc;">Lead</td>
                                    <td valign="top" style="padding:11px; border:1px solid #e2e8f0; font-size:14px;">{{leadName}}</td>
                                </tr>
                                <tr>
                                    <td width="38%" valign="top" bgcolor="#f8fafc" style="padding:11px; border:1px solid #e2e8f0; font-weight:bold; font-size:14px; background-color:#f8fafc;">Lead ID</td>
                                    <td valign="top" style="padding:11px; border:1px solid #e2e8f0; font-size:14px;">{{leadId}}</td>
                                </tr>
                                <tr>
                                    <td width="38%" valign="top" bgcolor="#f8fafc" style="padding:11px; border:1px solid #e2e8f0; font-weight:bold; font-size:14px; background-color:#f8fafc;">Product</td>
                                    <td valign="top" style="padding:11px; border:1px solid #e2e8f0; font-size:14px;">{{productType}}</td>
                                </tr>
                                <tr>
                                    <td width="38%" valign="top" bgcolor="#f8fafc" style="padding:11px; border:1px solid #e2e8f0; font-weight:bold; font-size:14px; background-color:#f8fafc;">Previous status</td>
                                    <td valign="top" style="padding:11px; border:1px solid #e2e8f0; font-size:14px;">{{oldStatus}}</td>
                                </tr>
                                <tr>
                                    <td width="38%" valign="top" bgcolor="#f8fafc" style="padding:11px; border:1px solid #e2e8f0; font-weight:bold; font-size:14px; background-color:#f8fafc;">New status</td>
                                    <td valign="top" style="padding:11px; border:1px solid #e2e8f0; font-size:14px;"><strong>{{newStatus}}</strong></td>
                                </tr>
                            </table>
                            <p style="margin:22px 0 0 0; font-size:13px; color:#64748b;">ScaleX Finance — Lead Management</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
