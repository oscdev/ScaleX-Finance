<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advisor Registration — ScaleX Finance</title>
</head>
<body style="margin:0; padding:0; background-color:#f0fdf4; font-family:Arial, Helvetica, sans-serif; color:#14532d; line-height:1.55;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f0fdf4" style="width:100%; background-color:#f0fdf4;">
        <tr>
            <td align="center" style="padding:24px 12px;">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:600px; max-width:600px; background-color:#ffffff; border:1px solid #bbf7d0;">
                    <tr>
                        <td align="center" style="padding:28px 28px 8px 28px;">
                            <p style="margin:0; font-size:22px; font-weight:bold; color:#15803d;">Advisor Registration</p>
                            <p style="margin:8px 0 0 0; font-size:14px; color:#4b5563;">{{headline}}</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:16px 28px 28px 28px;">
                            <p style="margin:0 0 14px 0; font-size:15px; color:#1f2937;">Hello <strong>{{recipientName}}</strong> ({{recipientRole}}),</p>
                            <p style="margin:0 0 18px 0; font-size:15px; color:#1f2937;">{{introText}}</p>
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; border-collapse:collapse;">
                                <tr>
                                    <td width="36%" valign="top" style="padding:10px 12px; border-bottom:1px solid #dcfce7; font-size:13px; color:#6b7280;">Applicant name</td>
                                    <td valign="top" style="padding:10px 12px; border-bottom:1px solid #dcfce7; font-size:14px; color:#111827;"><strong>{{advisorName}}</strong></td>
                                </tr>
                                <tr>
                                    <td width="36%" valign="top" style="padding:10px 12px; border-bottom:1px solid #dcfce7; font-size:13px; color:#6b7280;">Email</td>
                                    <td valign="top" style="padding:10px 12px; border-bottom:1px solid #dcfce7; font-size:14px; color:#111827;">{{email}}</td>
                                </tr>
                                <tr>
                                    <td width="36%" valign="top" style="padding:10px 12px; border-bottom:1px solid #dcfce7; font-size:13px; color:#6b7280;">Mobile</td>
                                    <td valign="top" style="padding:10px 12px; border-bottom:1px solid #dcfce7; font-size:14px; color:#111827;">{{mobile}}</td>
                                </tr>
                                <tr>
                                    <td width="36%" valign="top" style="padding:10px 12px; border-bottom:1px solid #dcfce7; font-size:13px; color:#6b7280;">Location</td>
                                    <td valign="top" style="padding:10px 12px; border-bottom:1px solid #dcfce7; font-size:14px; color:#111827;">{{location}}</td>
                                </tr>
                                <tr>
                                    <td width="36%" valign="top" style="padding:10px 12px; font-size:13px; color:#6b7280;">Specialization</td>
                                    <td valign="top" style="padding:10px 12px; font-size:14px; color:#111827;">{{specialization}}</td>
                                </tr>
                            </table>
                            <p style="margin:20px 0 0 0; font-size:13px; color:#6b7280;">ScaleX Finance — Partner Onboarding</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
