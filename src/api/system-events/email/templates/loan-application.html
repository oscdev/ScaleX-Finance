<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Loan Application: ScaleX Finance</title>
</head>
<body style="margin:0; padding:0; background-color:#f3f4f6; font-family:Arial, Helvetica, sans-serif; color:#1f2937; line-height:1.6;">
    <!-- Outer wrapper: fixed width tables survive forward/reply better than div layouts -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f3f4f6" style="background-color:#f3f4f6; width:100%;">
        <tr>
            <td align="center" style="padding:20px 12px;">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:600px; max-width:600px; background-color:#ffffff; border:1px solid #e5e7eb;">
                    <!-- Accent bar -->
                    <tr>
                        <td bgcolor="#2563eb" style="background-color:#2563eb; height:4px; font-size:0; line-height:0;">&nbsp;</td>
                    </tr>
                    <tr>
                        <td style="padding:28px 32px;">
                            <h2 style="color:#1d4ed8; margin:0 0 16px 0; font-size:20px; font-weight:bold;">New Loan Application</h2>
                            <p style="margin:0 0 12px 0; font-size:15px;">Hello <strong>{{recipientName}}</strong> ({{recipientRole}}),</p>
                            <p style="margin:0 0 20px 0; font-size:15px;">A loan application was submitted on ScaleX Finance. Summary:</p>

                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f9fafb" style="width:100%; background-color:#f9fafb; border-collapse:collapse;">
                                <tr>
                                    <td width="40%" valign="top" style="padding:12px; border:1px solid #e5e7eb; font-weight:bold; width:40%; font-size:14px;">Applicant / Lead:</td>
                                    <td valign="top" style="padding:12px; border:1px solid #e5e7eb; font-size:14px;">{{applicantName}}</td>
                                </tr>
                                <tr>
                                    <td width="40%" valign="top" style="padding:12px; border:1px solid #e5e7eb; font-weight:bold; width:40%; font-size:14px;">Lead ID:</td>
                                    <td valign="top" style="padding:12px; border:1px solid #e5e7eb; font-size:14px;">{{leadId}}</td>
                                </tr>
                                <tr>
                                    <td width="40%" valign="top" style="padding:12px; border:1px solid #e5e7eb; font-weight:bold; width:40%; font-size:14px;">Amount:</td>
                                    <td valign="top" style="padding:12px; border:1px solid #e5e7eb; font-size:14px;">INR {{amount}}</td>
                                </tr>
                                <tr>
                                    <td width="40%" valign="top" style="padding:12px; border:1px solid #e5e7eb; font-weight:bold; width:40%; font-size:14px;">Product:</td>
                                    <td valign="top" style="padding:12px; border:1px solid #e5e7eb; font-size:14px;">{{productType}}</td>
                                </tr>
                                <tr>
                                    <td width="40%" valign="top" style="padding:12px; border:1px solid #e5e7eb; font-weight:bold; width:40%; font-size:14px;">Mobile:</td>
                                    <td valign="top" style="padding:12px; border:1px solid #e5e7eb; font-size:14px;">{{mobile}}</td>
                                </tr>
                                <tr>
                                    <td width="40%" valign="top" style="padding:12px; border:1px solid #e5e7eb; font-weight:bold; width:40%; font-size:14px;">City / PIN:</td>
                                    <td valign="top" style="padding:12px; border:1px solid #e5e7eb; font-size:14px;">{{city}}</td>
                                </tr>
                            </table>

                            <p style="margin:20px 0 0 0; font-size:14px; color:#6b7280;">ScaleX Finance</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
