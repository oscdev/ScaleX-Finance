extract:

  consumer_name:
    aliases:
      - Name
      - Consumer Name
      - Full Name

    patterns:
      - '(?is)PERSONAL\s*DETAILS\s*Name\s+([A-Z][A-Z .]{2,80}?)\s*(?=Date\s*Of\s*Birth|Gender|IDENTIFICATION)'
      - '(?is)Hello,\s*([A-Z][A-Z .]{2,80}?)\s*(?=PERSONAL\s*DETAILS)'

    validation:
      type: string
      min_length: 3
      max_length: 100

    normalization:
      strip: true
      collapse_spaces: true

    value: one
    context_window: 5


  date_of_birth:
    aliases:
      - Date Of Birth
      - Date of Birth
      - DOB

    patterns:
      - '(?is)Date\s*Of\s*Birth\s*(\d{2}/\d{2}/\d{4})'
      - '(?is)Date\s*of\s*Birth\s*(\d{2}/\d{2}/\d{4})'

    validation:
      type: date

    normalization:
      strip: true

    value: one
    context_window: 4


  gender:
    aliases:
      - Gender

    patterns:
      - '(?is)Gender\s*(Male|Female|Other|Transgender)'

    validation:
      type: regex
      regex: '^(Male|Female|Other|Transgender)$'

    normalization:
      strip: true

    value: one
    context_window: 3


  telephone_numbers:
    value: telephones
    top_n: 2
    region_pattern: '(?is)CONTACT\s*DETAILS(.*?)(?=EMAIL\s*DETAILS|EMPLOYMENT\s*DETAILS|Credit\s*Limit|$)'


  email_id:
    aliases:
      - Email ID
      - Email
      - E-mail

    patterns:
      - '(?is)EMAIL\s*DETAILS\s*Email\s*ID\s*\n\s*([A-Z0-9._%+\-]+@[A-Z0-9.\-]+\.[A-Z]{2,})'
      - '(?is)Email\s*ID\s*\n\s*([A-Z0-9._%+\-]+@[A-Z0-9.\-]+\.[A-Z]{2,})'

    validation:
      type: regex
      regex: '^[A-Z0-9._%+\-]+@[A-Z0-9.\-]+\.[A-Z]{2,}$'

    normalization:
      strip: true
      uppercase: true

    value: one
    context_window: 4


  employment_account_type:
    aliases:
      - Account Type

    patterns:
      - '(?is)EMPLOYMENT\s*DETAILS\s*Account\s*Type\s*\n\s*([^\n]+)'

    validation:
      type: string
      min_length: 2
      max_length: 60

    normalization:
      strip: true
      collapse_spaces: true

    value: one
    context_window: 4


  employment_date_reported:
    aliases:
      - Date Reported

    patterns:
      - '(?is)EMPLOYMENT\s*DETAILS.*?Date\s*Reported\s*\n\s*(\d{2}/\d{2}/\d{4})'

    validation:
      type: date

    normalization:
      strip: true

    value: one
    context_window: 6


  occupation:
    aliases:
      - Occupation

    patterns:
      - '(?is)EMPLOYMENT\s*DETAILS.*?Occupation\s*\n\s*([A-Za-z ]{2,40})'

    validation:
      type: string
      min_length: 2
      max_length: 40

    normalization:
      strip: true
      collapse_spaces: true

    value: one
    context_window: 6


  open_accounts:
    value: accounts
    region_pattern: '(?is)OPEN\s*ACCOUNTS(.*?)(?=CLOSED\s*ACCOUNTS|$)'
    reference_date_pattern:
      - '(?im)^\s*Date\s*:\s*(\d{2}/\d{2}/\d{4})'
      - '(?i)REPORT\s*DATE\s*(?:&|AND)?\s*TIME\s*:\s*(\d{2}/\d{2}/\d{4})'
    validation:
      months_back: 12


  enquiries:
    value: enquiries
    region_pattern: '(?is)ENQUIRY\s*DETAILS(.*?)(?=Disclaimer|End\s*of\s*report|$)'
    reference_date_pattern:
      - '(?im)^\s*Date\s*:\s*(\d{2}/\d{2}/\d{4})'
      - '(?i)REPORT\s*DATE\s*(?:&|AND)?\s*TIME\s*:\s*(\d{2}/\d{2}/\d{4})'
    validation:
      months_back: 3


  cibil_score:
    aliases:
      - CIBIL Score
      - Creditvision Score
      - Bureau Score

    # Ordered most-specific first: apply_patterns collects candidates
    # pattern by pattern, and the extractor returns the first one
    # that validates - so a precise pattern here reliably wins even
    # when a later, broader pattern would also match, e.g. against
    # descriptive boilerplate text that itself mentions "300"/"900"
    # before the real score appears.
    patterns:
      - '(?is)Your\s*CIBIL\s*Score\s*is\s*([3-9][0-9]{2})'
      - '(?is)SCORING\s*FACTORS.*?([3-9][0-9]{2})'
      - '(?is)300\s*\(high\s*risk\)\s*to\s*900\s*\(low\s*risk\).*?300\s*900\s*([3-9][0-9]{2})'
      - '(?is)CIBIL\s*Score.*?\b([3-9][0-9]{2})\b'

    validation:
      type: integer
      min: 300
      max: 900

    normalization:
      strip: true

    value: one
    context_window: 3


  pan_number:
    aliases:
      - PAN
      - PAN Number
      - Permanent Account Number

    patterns:
      - '(?i)PAN\s*:?\s*([A-Z]{5}[0-9]{4}[A-Z])'
      - '(?i)PAN\s*Number\s*:?\s*([A-Z]{5}[0-9]{4}[A-Z])'
      - '(?i)Permanent\s*Account\s*Number\s*:?\s*([A-Z]{5}[0-9]{4}[A-Z])'
      - '\b([A-Za-z]{5}[0-9]{4}[A-Za-z])\b'

    validation:
      type: regex
      regex: '^[A-Z]{5}[0-9]{4}[A-Z]$'

    normalization:
      uppercase: true
      strip: true

    value: one
    context_window: 3


  permanent_address:
    aliases:
      - Permanent
      - Residence
      - Address
      - Permanent Address
      - Residence Address

    # Used when a report lists multiple labelled addresses side by
    # side (group 1 = address text, group 2 = its category label).
    # If this doesn't match a given report, extraction falls back to
    # the aliases/patterns-based hybrid search below.
    category_pattern: '(?is)\bAddress\b(?!\s*DETAILS)\s*(.*?)\s*\bCategory\b\s*(.*?)\s*(?=Residence\s*Code|Date\s*Reported|$)'
    preferred_category: 'Permanent Address'

    patterns:
      - '(?is)([A-Za-z0-9,/().#\-\s]{20,250}?\b\d{6}\b)'
      - '(?is)([A-Za-z0-9,/().#\-\s]{20,250}?,\s*[A-Za-z ]+\s*-\s*\d{6})'
      - '(?is)([A-Za-z0-9,/().#\-\s]{20,250}?,\s*[A-Za-z ]+\s+\d{6})'
      - '(?is)([A-Za-z0-9,/().#\-\n\s]{20,300}\b\d{6}\b)'

    validation:
      type: address
      min_length: 20
      max_length: 250
      min_score: 70

    normalization:
      strip: true
      collapse_spaces: true
      collapse_newlines: true

    value: one
    context_window: 7


  active_unsecured_loan_count:

    # Bound the search to the accounts section, excluding the
    # enquiries list further down (which reuses "Member Name" too).
    # If a report has no such heading, the whole document is used.
    region_pattern: '(?is)ALL\s*ACCOUNTS(.*?)(?=ENQUIRY\s*DETAILS|$)'

    # Split the (bounded) document into one block per reported
    # account. Two known anchor conventions are listed - whichever
    # one actually appears in a given report is used.
    block_pattern:
      - '(?is)ACCOUNT\s*INFORMATION(.*?)(?=ACCOUNT\s*INFORMATION|CONSUMER\s*ENQUIRY|ENQUIRY\s*DETAILS|$)'
      - '(?is)Member\s*Name(.*?)(?=Member\s*Name|Disclaimer|ENQUIRY\s*DETAILS|$)'

    # Convention 1: a literal status token inside each block.
    status_patterns:
      active: '(?i)\bACTIVE\b'
      inactive: '(?i)\bINACTIVE\b'

    # Convention 2: accounts are grouped under a labelled section
    # instead of being tagged individually. Used automatically when
    # no block anywhere matches status_patterns.
    scope_patterns:
      active: '(?is)OPEN\s*ACCOUNTS(.*?)(?=CLOSED\s*ACCOUNTS|$)'
      inactive: '(?is)CLOSED\s*ACCOUNTS(.*?)$'

    # Extract the account type text from within the block
    type_pattern: '(?is)Account\s*Type\s*:?\s*(.{1,60}?)\s*(?:Account\s*Number|Member|Amounts|Ownership|$)'

    # Keyword lists used to classify the extracted type text.
    # Add/adjust keywords per bureau/report vocabulary - no code
    # changes needed.
    type_classification:
      unsecured:
        - Personal Loan
        - Credit Card
        - Consumer Loan
        - Business Loan
        - Microfinance
        - Overdraft
        - Education Loan
      secured:
        - Housing Loan
        - Home Loan
        - Property Loan
        - Construction Equipment Loan
        - Gold Loan
        - Auto Loan
        - Car Loan
        - Vehicle Loan
        - Two-wheeler Loan
        - Two Wheeler Loan
        - Commercial Vehicle Loan
        - Loan Against Property

    # Only count blocks satisfying both of these
    count_status: active
    count_classification: unsecured

    value: count